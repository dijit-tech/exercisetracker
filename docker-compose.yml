services:
  web:
    build: .
    container_name: exercisetracker_web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=exercisetracker
      - DB_USER=root
      - DB_PASS=rootpassword
      - APP_ENV=local
      - APP_URL=http://localhost:8000
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: exercisetracker_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: exercisetracker
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/schema_complete.sql:/docker-entrypoint-initdb.d/02_schema.sql
      - ./database/rename_rooms_to_challenges.sql:/docker-entrypoint-initdb.d/03_rename.sql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: exercisetracker_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
